<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Job Docket</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232b2620'/%3E%3Crect x='14' y='10' width='36' height='16' rx='2' fill='%23f6f1e4'/%3E%3Crect x='10' y='24' width='44' height='22' rx='3' fill='%23b3452c'/%3E%3Crect x='18' y='36' width='28' height='18' rx='1' fill='%23f6f1e4'/%3E%3Ccircle cx='46' cy='30' r='2.5' fill='%234a6b53'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --kraft: #d9c9a3;
    --ink: #2b2620;
    --paper: #f6f1e4;
    --stamp-red: #b3452c;
    --stamp-green: #4a6b53;
    --line: #c9b98f;
    --shadow: rgba(43,38,32,0.25);
    --wa-doc: #ece5d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.15), transparent 40%), var(--kraft);
    font-family: 'Courier New', Courier, monospace; color:var(--ink);
    padding: 32px 16px 80px;
  }
  .wrap{ max-width: 780px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 28px; }
  header .eyebrow{ letter-spacing: 0.35em; font-size: 11px; text-transform:uppercase; opacity:0.6; }
  header h1{ font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: clamp(28px, 5vw, 44px); margin: 6px 0 4px; }
  header .sub{ font-size: 13px; opacity: 0.7; }
  .perforation{ height: 1px; background-image: repeating-linear-gradient(to right, var(--ink) 0 6px, transparent 6px 12px); opacity: 0.35; margin: 18px 0; }

  .ticket{
    background: var(--paper); border: 1px solid var(--line);
    box-shadow: 0 6px 0 var(--shadow), 0 6px 18px rgba(0,0,0,0.12);
    border-radius: 4px; padding: 22px 24px; margin-bottom: 22px; position: relative;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:16px; height:16px; background: var(--kraft);
    border-radius:50%; top:50%; transform: translateY(-50%); box-shadow: inset 0 0 0 1px var(--line);
  }
  .ticket::before{ left:-9px; } .ticket::after{ right:-9px; }

  form.add-form{ display:flex; flex-direction:column; gap:14px; }
  .form-row{ display:flex; flex-direction:column; gap:6px; }
  .form-row.split{ flex-direction:row; gap:16px; }
  .form-row.split > div{ flex:1; display:flex; flex-direction:column; gap:6px; }
  label{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.65; }
  input[type="text"], input[type="number"]{
    font-family: inherit; font-size: 15px; padding: 10px 12px;
    background: #fffdf7; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); outline: none;
  }
  input:focus{ border-color: var(--stamp-red); box-shadow: 0 0 0 2px rgba(179,69,44,0.15); }

  .upload-box{
    border: 2px dashed var(--line); border-radius: 4px; padding: 18px; text-align: center;
    background: #fffdf7; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .upload-box:hover{ border-color: var(--stamp-red); }
  .upload-box.has-file{ border-style: solid; border-color: var(--stamp-green); background: #f2f6f1; }
  .upload-box input[type="file"]{ display:none; }
  .upload-hint{ font-size: 13px; opacity: 0.65; }
  .upload-filename{ font-size: 14px; font-weight: bold; margin-top: 4px; word-break: break-word; }

  button{ font-family: inherit; cursor: pointer; border: none; border-radius: 3px; }
  .btn-primary{
    background: var(--ink); color: var(--paper); font-size: 14px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 12px 18px; align-self: flex-start;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn-primary:disabled{ opacity: 0.4; cursor: not-allowed; }
  .btn-primary:hover:not(:disabled){ background:#000; }
  .btn-primary:active:not(:disabled){ transform: translateY(1px); }

  .section-label{
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.25em; opacity: 0.55;
    margin: 34px 0 14px; display:flex; align-items:center; gap: 10px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background: var(--ink); opacity:0.25; }

  .filter-tabs{ display:flex; gap:8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-tab{
    background:#fffdf7; border:1px solid var(--line); border-radius:3px; padding:8px 14px;
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.65; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .filter-tab:hover{ opacity:1; border-color: var(--ink); }
  .filter-tab.active{ opacity:1; border-color: var(--ink); background:#f2ede0; font-weight:bold; }
  .filter-tab .count{
    background: var(--ink); color: var(--paper); border-radius: 10px; font-size: 10px;
    padding: 1px 7px; min-width: 16px; text-align:center;
  }
  .filter-tab.active .count{ background: var(--stamp-red); }

  .toolbar{ display:flex; gap:10px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
  .search-box{
    flex:1; min-width: 160px; font-family: inherit; font-size: 14px; padding: 9px 12px;
    background:#fffdf7; border:1px solid var(--line); border-radius:3px; color:var(--ink); outline:none;
  }
  .search-box:focus{ border-color: var(--stamp-red); }
  .bulk-actions{ display:flex; gap:8px; flex-wrap: wrap; }
  .bulk-actions button{
    background: transparent; border:1px solid var(--line); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 8px 12px; color: var(--ink); opacity: 0.75;
  }
  .bulk-actions button:hover{ opacity:1; border-color: var(--ink); }

  .job{
    background: var(--paper); border: 1px solid var(--line); border-left: 6px solid var(--stamp-green);
    border-radius: 3px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }
  .job.editing{ border-left-color: var(--stamp-red); }
  .job-top{ display:flex; justify-content: space-between; align-items:flex-start; gap: 12px; flex-wrap: wrap; }
  .job-id{ font-size: 11px; opacity: 0.5; letter-spacing: 0.1em; }
  .job-name{ font-family: Georgia, serif; font-size: 17px; font-weight: 700; margin: 2px 0 8px; word-break: break-word; }

  .doc-bubble{
    display:flex; align-items:center; gap: 12px; background: var(--wa-doc); border-radius: 8px;
    padding: 10px 12px; max-width: 340px; text-decoration:none; color: var(--ink); border: 1px solid #d9d0bd;
  }
  .doc-bubble:hover{ background: #e2dac9; }
  .doc-icon{ width: 38px; height: 44px; flex-shrink:0; position:relative; background: var(--stamp-red); border-radius: 3px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .doc-icon::before{ content:"PDF"; color:#fff; font-size: 9px; font-weight:bold; letter-spacing:0.02em; }
  .doc-icon::after{ content:""; position:absolute; top:0; right:0; width:0; height:0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent #7a2c1c transparent transparent; }
  .doc-icon.has-thumb::before, .doc-icon.has-thumb::after{ display:none; }
  .doc-icon img{ width:100%; height:100%; object-fit:cover; }
  .doc-info{ min-width:0; }
  .doc-fname{ font-size: 13.5px; font-weight: bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-fsize{ font-size: 11.5px; opacity: 0.6; margin-top: 2px; }
  .doc-missing{ font-size: 12px; color: var(--stamp-red); font-style: italic; }

  .job-actions{ display:flex; gap: 8px; flex-shrink: 0; }
  .icon-btn{ background: transparent; border: 1px solid var(--line); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 7px 12px; color: var(--ink); opacity: 0.75; }
  .icon-btn:hover{ opacity: 1; border-color: var(--ink); }
  .icon-btn.danger:hover{ border-color: var(--stamp-red); color: var(--stamp-red); }

  .counts{ display:flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .stamp{ display:inline-flex; align-items:center; gap: 6px; font-size: 13px; padding: 6px 12px; border: 2px solid; border-radius: 3px; transform: rotate(-1.2deg); font-weight:bold; letter-spacing: 0.03em; }
  .stamp.bw{ border-color: var(--ink); color: var(--ink); }
  .stamp.color{ border-color: var(--stamp-red); color: var(--stamp-red); transform: rotate(1deg); }
  .stamp.method{ transform: rotate(-0.6deg); }
  .stamp.method.online{ border-color: var(--stamp-green); color: var(--stamp-green); }
  .stamp.method.xerox{ border-color: var(--ink); color: var(--ink); }

  .method-toggle{ display:flex; gap:8px; }
  .method-toggle label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line); border-radius:3px; padding:9px 10px; cursor:pointer;
    background:#fffdf7; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.65;
  }
  .method-toggle input{ display:none; }
  .method-toggle input:checked + span{ font-weight:bold; }
  .method-toggle label:has(input:checked){ opacity:1; border-color: var(--ink); background:#f2ede0; }

  .job.done{ opacity:0.55; background:#eef1ec; }
  .job.done .job-name{ text-decoration: line-through; }
  .done-btn{ }
  .done-btn.is-done{ background: var(--stamp-green); color:#fff; border-color: var(--stamp-green); opacity:1; }

  .edit-form{ display:flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .edit-form .form-row.split{ gap: 10px; }
  .edit-actions{ display:flex; gap:8px; margin-top: 4px; }
  .btn-save{ background: var(--stamp-green); color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; padding: 9px 16px; }
  .btn-cancel{ background: transparent; border: 1px solid var(--line); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; padding: 9px 16px; color: var(--ink); opacity: 0.7; }

  .empty{ text-align:center; padding: 40px 20px; opacity: 0.55; font-size: 14px; border: 1px dashed var(--line); border-radius: 4px; }

  .totals{
    margin-top: 30px; background: var(--ink); color: var(--paper); border-radius: 4px;
    padding: 20px 24px; display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 14px;
  }
  .totals .label{ font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7; }
  .totals .figures{ display:flex; gap: 22px; flex-wrap: wrap; }
  .totals .figure{ text-align:center; }
  .totals .figure .num{ font-family: Georgia, serif; font-size: 26px; font-weight: 700; }
  .totals .figure.color .num{ color: #e08a6f; }
  .totals .figure .cap{ font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.7; }

  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 4px;
    font-size: 13px; transition: transform 0.25s ease; z-index: 10; max-width: 90%; text-align:center;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }

  /* ---- PDF viewer modal ---- */
  .pdf-modal{
    display:none; position:fixed; inset:0; z-index: 100;
  }
  .pdf-modal.open{ display:block; }
  .pdf-modal-backdrop{
    position:absolute; inset:0; background: rgba(20,17,13,0.82);
  }
  .pdf-modal-content{
    position:absolute; inset: 0; display:flex; flex-direction:column;
    background: var(--kraft);
  }
  @media (min-width: 720px){
    .pdf-modal-content{
      inset: 4vh 8vw; border-radius: 6px; overflow:hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
  }
  .pdf-modal-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--ink); color: var(--paper); padding: 10px 14px; flex-wrap: wrap;
  }
  .pdf-modal-title{
    font-size: 13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    flex: 1 1 140px; min-width: 80px;
  }
  .pdf-modal-controls{ display:flex; align-items:center; gap: 6px; flex-wrap: wrap; }
  .pdf-modal-controls button, .pdf-modal-controls a{
    background: transparent; border: 1px solid rgba(246,241,228,0.4); color: var(--paper);
    font-family: inherit; font-size: 13px; padding: 7px 11px; border-radius: 3px; cursor:pointer;
    text-decoration:none; line-height:1;
  }
  .pdf-modal-controls button:hover, .pdf-modal-controls a:hover{ background: rgba(246,241,228,0.15); }
  .pdf-modal-controls button:disabled{ opacity:0.35; cursor:not-allowed; }
  .pdf-page-indicator{ font-size: 12px; opacity: 0.85; padding: 0 4px; white-space:nowrap; }
  .pdf-modal-close{ font-size: 18px !important; padding: 6px 12px !important; }

  .pdf-modal-body{
    flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
    padding: 18px 10px 40px; -webkit-overflow-scrolling: touch; touch-action: pan-y pinch-zoom;
    background: repeating-linear-gradient(45deg, #cabb92, #cabb92 10px, #c3b389 10px, #c3b389 20px);
  }
  #printModalBodyWrap{padding:0 !important;overflow:auto;display:flex;flex-direction:column;align-items:stretch;background:none !important;}
  #printModalBodyWrap img{display:block;width:100%;flex-shrink:0;}

  .pdf-modal-body canvas{
    background:#fff; box-shadow: 0 6px 24px rgba(0,0,0,0.35); max-width: 100%; height:auto;
  }
  .pdf-modal-loading, .pdf-modal-error{
    color: var(--ink); font-size: 14px; text-align:center; padding: 60px 20px; opacity:0.8;
  }

  @media (max-width: 520px){
    .pdf-modal-controls{ gap: 4px; }
    .pdf-modal-controls button, .pdf-modal-controls a{ padding: 8px 9px; font-size: 12px; }
    .pdf-modal-title{ flex-basis: 100%; order: -1; }
  }

  .job-id{ cursor:pointer; }
  .job-id:hover{ text-decoration: underline; }

  .live-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--stamp-green);
    margin-right:5px; vertical-align:middle; animation: pulse 1.6s infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  footer{ text-align:center; margin-top: 34px; font-size: 11px; opacity: 0.5; letter-spacing: 0.06em; }

  @media print{
    *{ visibility:hidden !important; }
    #printModal, #printModal *{ visibility:visible !important; }
    #printModal{ position:absolute !important; top:0 !important; left:0 !important; width:100vw !important; background:none !important; border:none !important; box-shadow:none !important; }
    #printModal .pdf-modal-backdrop, #printModal .pdf-modal-header{ display:none !important; }
    #printModal .pdf-modal-content{ position:static !important; box-shadow:none !important; border:none !important; background:none !important; inset:auto !important; margin:0 !important; padding:0 !important; }
    #printModal .pdf-modal-body{ padding:0 !important; margin:0 !important; overflow:visible !important; background:none !important; display:block !important; height:auto !important; }
    #printModalBodyWrap{ padding:0 !important; margin:0 !important; overflow:visible !important; display:block !important; height:auto !important; }
    #printModalBodyWrap img{ display:block !important; width:100% !important; height:auto !important; margin:0 !important; padding:0 !important; page-break-after:always; page-break-inside:avoid; }
    #printModalBodyWrap img:last-child{ page-break-after:auto; }
  }

  @media (max-width: 520px){
    .form-row.split{ flex-direction: column; }
    .job-top{ flex-direction: column; }
    .job-actions{ align-self: flex-start; }
    .doc-bubble{ max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Job Docket</div>
    <h1>Print Queue</h1>
    <div class="sub">Upload the PDF, mark the copies, hand this to the Xerox counter.</div>
  </header>

  <div class="perforation"></div>

  <div id="offlineBanner" style="display:none; background:var(--stamp-red); color:#fff; text-align:center; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; padding:8px 12px; border-radius:3px; margin-bottom:16px;">
    Offline — showing last synced queue. Adding/editing needs a connection.
  </div>

  <div class="ticket">
    <form class="add-form" id="addForm">
      <div class="form-row">
        <label for="name">File name / label</label>
        <input type="text" id="name" placeholder="e.g. Aunt Rina's Passport Copy" required>
      </div>
      <div class="form-row">
        <label>PDF file</label>
        <label class="upload-box" id="uploadBox" for="fileInput">
          <div class="upload-hint" id="uploadHint">Tap to choose a PDF from this device</div>
          <div class="upload-filename" id="uploadFilename"></div>
          <input type="file" id="fileInput" accept="application/pdf">
        </label>
      </div>
      <div class="form-row split">
        <div>
          <label for="bw">Black &amp; White copies</label>
          <input type="number" id="bw" min="0" value="0">
        </div>
        <div>
          <label for="color">Colour copies</label>
          <input type="number" id="color" min="0" value="0">
        </div>
      </div>
      <div class="form-row">
        <label>Print method</label>
        <div class="method-toggle">
          <label><input type="radio" name="method" value="XEROX" checked><span>Xerox</span></label>
          <label><input type="radio" name="method" value="ONLINE"><span>Online</span></label>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Add to queue</button>
    </form>
  </div>

  <div class="section-label">Jobs</div>

  <div class="filter-tabs" id="filterTabs"></div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="Search jobs by name...">
    <div class="bulk-actions">
      <button type="button" id="markAllDoneBtn" onclick="markAllDone()">Mark all done</button>
      <button type="button" id="clearDoneBtn" onclick="clearCompleted()">Clear completed</button>
    </div>
  </div>

  <div id="jobList"></div>

  <div class="totals" id="totals"></div>

  <footer><span class="live-dot"></span>SHARED QUEUE &middot; SYNCED VIA WORKER API &middot; LIVE</footer>
</div>

<div class="toast" id="toast"></div>

<div class="pdf-modal" id="pdfModal">
  <div class="pdf-modal-backdrop" onclick="closePdfModal()"></div>
  <div class="pdf-modal-content">
    <div class="pdf-modal-header">
      <div class="pdf-modal-title" id="pdfModalTitle">document.pdf</div>
      <div class="pdf-modal-controls">
        <button type="button" id="pdfPrevBtn" onclick="pdfPrevPage()" title="Previous page">&#8592;</button>
        <span class="pdf-page-indicator" id="pdfPageIndicator">–</span>
        <button type="button" id="pdfNextBtn" onclick="pdfNextPage()" title="Next page">&#8594;</button>
        <button type="button" onclick="pdfZoomOut()" title="Zoom out">&minus;</button>
        <button type="button" onclick="pdfZoomIn()" title="Zoom in">&plus;</button>
        <button type="button" id="pdfPrintBtn" onclick="printPdf()" title="Print PDF">Print</button>
        <button type="button" class="pdf-modal-close" onclick="closePdfModal()" title="Close">&times;</button>
      </div>
    </div>
    <div class="pdf-modal-body" id="pdfModalBody">
      <div class="pdf-modal-loading" id="pdfModalLoading">Loading document…</div>
      <canvas id="pdfCanvas" style="display:none;"></canvas>
    </div>
  </div>
</div>

<div class="pdf-modal" id="printModal">
  <div class="pdf-modal-backdrop" onclick="closePrintModal()"></div>
  <div class="pdf-modal-content">
    <div class="pdf-modal-header">
      <div class="pdf-modal-title" id="printModalTitle">Print Preview</div>
      <div class="pdf-modal-controls">
        <button type="button" id="printModalBtn" onclick="triggerPrintModal()" style="background:rgba(246,241,228,0.2);font-weight:bold;">Print</button>
        <button type="button" class="pdf-modal-close" onclick="closePrintModal()" title="Close">&times;</button>
      </div>
    </div>
    <div class="pdf-modal-body" id="printModalBodyWrap" style="padding:0;">
      <div class="pdf-modal-loading" id="printModalLoading">Preparing print…</div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://shark.shinumaths989.workers.dev";
  const CACHE_KEY = "print-queue-cache-v1";

  let jobs = [];
  let editingId = null;
  let pendingFile = null;
  let currentFilter = 'ONLINE'; // default view on load
  let searchQuery = '';
  const pendingToggles = new Map(); // jobId -> optimistic done value still settling on the backend
  let lastRenderSig = null;

  // Cross-tab instant sync on this device/browser (tick marks, edits, etc.)
  let bc = null;
  try{ bc = new BroadcastChannel('print-queue-sync'); }catch(e){}
  if(bc) bc.onmessage = () => loadJobs(true);
  function notifyOtherTabs(){ try{ if(bc) bc.postMessage('refresh'); }catch(e){} }

  function ticketNo(n){ return '#' + String(n).padStart(4, '0'); }
  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadJobs(silent){
    try{
      const res = await fetch(API_BASE + '/jobs');
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      jobs = data.jobs || [];
      if(pendingToggles.size){
        jobs.forEach(j => { if(pendingToggles.has(j.id)) j.done = pendingToggles.get(j.id); });
      }
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify(jobs)); }catch(e){}
      // Skip a full DOM/thumbnail rebuild if nothing actually changed since the
      // last render — rebuilding on every poll was recreating cached PDF thumbnail
      // images repeatedly and could crash the tab (memory pressure -> "Aww, Snap!").
      const sig = JSON.stringify(jobs);
      if(sig === lastRenderSig && editingId === null){
        const banner = document.getElementById('offlineBanner');
        if(banner) banner.style.display = 'none';
        return;
      }
      lastRenderSig = sig;
      render(false);
    }catch(e){
      let cached = [];
      try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); }catch(_){}
      if(cached.length){
        jobs = cached;
        render(true);
        if(!silent) showToast('Offline — showing last synced queue.');
      } else if(!silent){
        document.getElementById('jobList').innerHTML =
          '<div class="empty">Could not reach the print queue server, and no cached queue is saved yet. Connect once to sync.</div>';
      }
    }
  }

  // ---- In-page PDF viewer modal (PDF.js) ----
  let pdfModalDoc = null;
  let pdfModalPage = 1;
  let pdfModalScale = 1;
  let pdfModalBaseScale = 1;
  let pdfModalRenderTask = null;

  let currentPdfJobId = null;

  window.openPdf = async function(jobId){
    currentPdfJobId = jobId;
    const job = jobs.find(j => j.id === jobId);
    const modal = document.getElementById('pdfModal');
    const title = document.getElementById('pdfModalTitle');
    const loading = document.getElementById('pdfModalLoading');
    const canvas = document.getElementById('pdfCanvas');
    title.textContent = (job && job.fileName) || 'document.pdf';
    loading.style.display = 'block';
    loading.textContent = 'Loading document…';
    canvas.style.display = 'none';
    document.getElementById('pdfPageIndicator').textContent = '–';
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    try{
      if(typeof pdfjsLib === 'undefined') throw new Error('pdf.js not available');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const res = await fetch(API_BASE + '/pdf/' + jobId);
      if(!res.ok) throw new Error('could not fetch PDF');
      const buf = await res.arrayBuffer();
      pdfModalDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      pdfModalPage = 1;
      pdfModalScale = 1;
      loading.style.display = 'none';
      canvas.style.display = 'block';
      await renderPdfModalPage();
    }catch(e){
      loading.style.display = 'block';
      loading.className = 'pdf-modal-error';
      loading.textContent = 'Could not load this PDF. Please try again.';
    }
  };

  async function renderPdfModalPage(){
    if(!pdfModalDoc) return;
    const canvas = document.getElementById('pdfCanvas');
    const body = document.getElementById('pdfModalBody');
    const page = await pdfModalDoc.getPage(pdfModalPage);

    // Fit the page to the available width by default (mobile-friendly), then apply zoom on top.
    const rawViewport = page.getViewport({ scale: 1 });
    const availWidth = Math.max(280, body.clientWidth - 24);
    pdfModalBaseScale = availWidth / rawViewport.width;
    const viewport = page.getViewport({ scale: pdfModalBaseScale * pdfModalScale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    if(pdfModalRenderTask){ try{ pdfModalRenderTask.cancel(); }catch(e){} }
    pdfModalRenderTask = page.render({ canvasContext: canvas.getContext('2d'), viewport });
    try{ await pdfModalRenderTask.promise; }catch(e){ /* cancelled render, ignore */ }
    page.cleanup();

    document.getElementById('pdfPageIndicator').textContent = pdfModalPage + ' / ' + pdfModalDoc.numPages;
    document.getElementById('pdfPrevBtn').disabled = pdfModalPage <= 1;
    document.getElementById('pdfNextBtn').disabled = pdfModalPage >= pdfModalDoc.numPages;
  }

  window.pdfPrevPage = function(){
    if(!pdfModalDoc || pdfModalPage <= 1) return;
    pdfModalPage--; renderPdfModalPage();
  };
  window.pdfNextPage = function(){
    if(!pdfModalDoc || pdfModalPage >= pdfModalDoc.numPages) return;
    pdfModalPage++; renderPdfModalPage();
  };
  window.pdfZoomIn = function(){
    if(!pdfModalDoc) return;
    pdfModalScale = Math.min(3, pdfModalScale + 0.25);
    renderPdfModalPage();
  };
  window.pdfZoomOut = function(){
    if(!pdfModalDoc) return;
    pdfModalScale = Math.max(0.5, pdfModalScale - 0.25);
    renderPdfModalPage();
  };

  window.closePdfModal = function(){
    const modal = document.getElementById('pdfModal');
    modal.classList.remove('open');
    document.body.style.overflow = '';
    if(pdfModalRenderTask){ try{ pdfModalRenderTask.cancel(); }catch(e){} pdfModalRenderTask = null; }
    if(pdfModalDoc){ try{ pdfModalDoc.destroy(); }catch(e){} pdfModalDoc = null; } // avoid the memory leak from before
    document.getElementById('pdfModalLoading').className = 'pdf-modal-loading';
  };

  window.printPdf = async function(){
    if(!currentPdfJobId){ showToast('No PDF loaded.'); return; }
    try{
      document.getElementById('pdfModal').classList.remove('open');
      document.body.style.overflow = '';
      var printModal = document.getElementById('printModal');
      var loading = document.getElementById('printModalLoading');
      var wrap = document.getElementById('printModalBodyWrap');
      wrap.innerHTML = '';
      wrap.appendChild(loading);
      loading.style.display = 'block';
      loading.textContent = 'Preparing print...';
      printModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const res = await fetch(API_BASE + '/pdf/' + currentPdfJobId);
      if(!res.ok) throw new Error('fetch failed');
      const buf = await res.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      for(var i = 1; i <= pdf.numPages; i++){
        var page = await pdf.getPage(i);
        var vp = page.getViewport({ scale: 2 });
        var c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        page.cleanup();
        var img = document.createElement('img');
        img.src = c.toDataURL('image/jpeg', 0.95);
        img.style.cssText = 'display:block;width:100%;';
        wrap.appendChild(img);
        c.width = 0; c.height = 0; c = null;
        await new Promise(function(r){ setTimeout(r, 10); });
      }
      pdf.destroy();
      loading.style.display = 'none';
      triggerPrintModal();
    }catch(e){ loading.textContent = 'Could not load PDF.'; }
  };

  window.triggerPrintModal = function(){
    var modal = document.getElementById('printModal');
    var header = modal.querySelector('.pdf-modal-header');
    var backdrop = modal.querySelector('.pdf-modal-backdrop');
    header.style.display = 'none';
    backdrop.style.display = 'none';
    modal.style.zIndex = '1';
    setTimeout(function(){
      window.print();
      setTimeout(function(){
        header.style.display = '';
        backdrop.style.display = '';
        modal.style.zIndex = '';
      }, 500);
    }, 300);
  };

  window.closePrintModal = function(){
    document.getElementById('printModal').classList.remove('open');
    document.body.style.overflow = '';
    var wrap = document.getElementById('printModalBodyWrap');
    var iframe = wrap.querySelector('iframe');
    if(iframe) wrap.removeChild(iframe);
  };

  // Close on Escape
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.getElementById('pdfModal').classList.contains('open')) closePdfModal();
  });

  // Swipe left/right between pages on touch devices
  (function(){
    const body = document.getElementById('pdfModalBody');
    let touchStartX = null, touchStartY = null;
    body.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    body.addEventListener('touchend', (e) => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
        if(dx < 0) window.pdfNextPage(); else window.pdfPrevPage();
      }
      touchStartX = null; touchStartY = null;
    }, { passive: true });
  })();

  // Re-fit the page if the viewport is resized/rotated while the modal is open
  window.addEventListener('resize', () => {
    if(document.getElementById('pdfModal').classList.contains('open') && pdfModalDoc) renderPdfModalPage();
  });

  function renderFilterTabs(){
    const el = document.getElementById('filterTabs');
    if(!el) return;
    const counts = {
      ALL: jobs.length,
      ONLINE: jobs.filter(j => (j.method || 'XEROX') === 'ONLINE').length,
      XEROX: jobs.filter(j => (j.method || 'XEROX') === 'XEROX').length
    };
    el.innerHTML = ['ALL', 'ONLINE', 'XEROX'].map(f => `
      <div class="filter-tab ${currentFilter === f ? 'active' : ''}" onclick="setFilter('${f}')">
        ${f} <span class="count">${counts[f]}</span>
      </div>
    `).join('');
  }
  window.setFilter = function(f){ currentFilter = f; render(); };

  function getFilteredJobs(){
    let list = jobs;
    if(currentFilter !== 'ALL'){
      list = list.filter(j => (j.method || 'XEROX') === currentFilter);
    }
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(j => (j.name || '').toLowerCase().includes(q));
    }
    return list;
  }

  function render(offline){
    lastRenderSig = JSON.stringify(jobs);
    const banner = document.getElementById('offlineBanner');
    if(banner) banner.style.display = offline ? 'block' : 'none';
    renderFilterTabs();
    const list = document.getElementById('jobList');
    const visibleJobs = getFilteredJobs();
    if(jobs.length === 0){
      list.innerHTML = '<div class="empty">No jobs yet. Upload a PDF above to start the queue.</div>';
    } else if(visibleJobs.length === 0){
      list.innerHTML = '<div class="empty">No jobs match this filter/search.</div>';
    } else {
      list.innerHTML = visibleJobs.map(job => {
        if(editingId === job.id){
          return `
            <div class="job editing">
              <div class="job-id">${ticketNo(job.ticket)}</div>
              <div class="edit-form">
                <div class="form-row">
                  <label>File name / label</label>
                  <input type="text" id="edit-name-${job.id}" value="${escapeHtml(job.name)}">
                </div>
                <div class="form-row split">
                  <div>
                    <label>Black &amp; White copies</label>
                    <input type="number" min="0" id="edit-bw-${job.id}" value="${job.bw}">
                  </div>
                  <div>
                    <label>Colour copies</label>
                    <input type="number" min="0" id="edit-color-${job.id}" value="${job.color}">
                  </div>
                </div>
                <div class="form-row">
                  <label>Print method</label>
                  <div class="method-toggle">
                    <label><input type="radio" name="edit-method-${job.id}" value="XEROX" ${(job.method || 'XEROX') === 'XEROX' ? 'checked' : ''}><span>Xerox</span></label>
                    <label><input type="radio" name="edit-method-${job.id}" value="ONLINE" ${job.method === 'ONLINE' ? 'checked' : ''}><span>Online</span></label>
                  </div>
                </div>
                <div class="edit-actions">
                  <button class="btn-save" onclick="saveEdit('${job.id}')">Save changes</button>
                  <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                </div>
              </div>
            </div>
          `;
        }
        const docPreview = job.hasFile
          ? `<a class="doc-bubble" href="javascript:void(0)" onclick="openPdf('${job.id}')">
               <div class="doc-icon" id="thumb-${job.id}"></div>
               <div class="doc-info">
                 <div class="doc-fname">${escapeHtml(job.fileName || 'document.pdf')}</div>
                 <div class="doc-fsize" id="meta-${job.id}"><span id="pages-${job.id}"></span>PDF &middot; ${fmtSize(job.fileSize || 0)} &middot; tap to preview</div>
               </div>
             </a>`
          : `<div class="doc-missing">No PDF attached</div>`;

        const method = job.method === 'ONLINE' ? 'ONLINE' : 'XEROX';
        return `
          <div class="job ${job.done ? 'done' : ''}">
            <div class="job-top">
              <div>
                <div class="job-id" onclick="copyTicket('${job.id}', '${ticketNo(job.ticket)}')" title="Tap to copy ticket number">${ticketNo(job.ticket)}</div>
                <div class="job-name">${escapeHtml(job.name)}</div>
                ${docPreview}
              </div>
              <div class="job-actions">
                <button class="icon-btn done-btn ${job.done ? 'is-done' : ''}" onclick="toggleDone('${job.id}')" title="Mark done">&#10003;</button>
                <button class="icon-btn" onclick="startEdit('${job.id}')">Edit</button>
                <button class="icon-btn" onclick="duplicateJob('${job.id}')" title="Duplicate this job">Duplicate</button>
                <button class="icon-btn danger" onclick="removeJob('${job.id}')">Remove</button>
              </div>
            </div>
            <div class="counts">
              <span class="stamp bw">B/W &middot; ${job.bw} copies</span>
              <span class="stamp color">Colour &middot; ${job.color} copies</span>
              <span class="stamp method ${method.toLowerCase()}">${method}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    const totalBw = visibleJobs.reduce((s, j) => s + Number(j.bw || 0), 0);
    const totalColor = visibleJobs.reduce((s, j) => s + Number(j.color || 0), 0);
    document.getElementById('totals').innerHTML = `
      <div class="label">${currentFilter} total &middot; ${visibleJobs.length} job${visibleJobs.length === 1 ? '' : 's'}</div>
      <div class="figures">
        <div class="figure"><div class="num">${totalBw}</div><div class="cap">B/W copies</div></div>
        <div class="figure color"><div class="num">${totalColor}</div><div class="cap">Colour copies</div></div>
      </div>
    `;

    renderThumbnails();
  }

  // ---- WhatsApp-style PDF thumbnails ----
  // Renders the first page of each PDF to a small image, cached by job id
  // so it's only generated once per session (not re-fetched every 4s refresh).
  const thumbCache = new Map(); // jobId -> { dataUrl, pageCount }

  async function renderThumbnails(){
    for(const job of jobs){
      if(!job.hasFile) continue;
      const iconEl = document.getElementById('thumb-' + job.id);
      const pagesEl = document.getElementById('pages-' + job.id);
      if(!iconEl) continue;

      if(thumbCache.has(job.id)){
        applyThumb(iconEl, pagesEl, thumbCache.get(job.id));
        continue;
      }
      generateThumb(job.id).then((result) => {
        if(!result) return;
        thumbCache.set(job.id, result);
        const iconEl2 = document.getElementById('thumb-' + job.id);
        const pagesEl2 = document.getElementById('pages-' + job.id);
        if(iconEl2) applyThumb(iconEl2, pagesEl2, result);
      });
    }
  }

  function applyThumb(iconEl, pagesEl, result){
    if(!iconEl.querySelector('img')){
      iconEl.classList.add('has-thumb');
      const img = document.createElement('img');
      img.src = result.dataUrl;
      iconEl.appendChild(img);
    }
    if(pagesEl && result.pageCount){
      pagesEl.textContent = result.pageCount + (result.pageCount === 1 ? ' page' : ' pages') + ' \u00b7 ';
    }
  }

  async function generateThumb(jobId){
    if(typeof pdfjsLib === 'undefined') return null;
    let pdf = null;
    let canvas = null;
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const res = await fetch(API_BASE + '/pdf/' + jobId);
      if(!res.ok) return null;
      const buf = await res.arrayBuffer();
      pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1 });
      const scale = 160 / viewport.width;
      const scaledViewport = page.getViewport({ scale });

      canvas = document.createElement('canvas');
      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaledViewport }).promise;

      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const pageCount = pdf.numPages;
      page.cleanup();
      return { dataUrl, pageCount };
    }catch(e){
      return null; // falls back to the plain PDF icon
    }finally{
      // Release PDF.js's internal buffers and the canvas's pixel memory —
      // without this, every thumbnail generated stays resident forever
      // (this was the cause of memory climbing to ~1GB).
      if(pdf){ try{ pdf.destroy(); }catch(e){} }
      if(canvas){ canvas.width = 0; canvas.height = 0; canvas = null; }
    }
  }

  const fileInput = document.getElementById('fileInput');
  const uploadBox = document.getElementById('uploadBox');
  const uploadHint = document.getElementById('uploadHint');
  const uploadFilename = document.getElementById('uploadFilename');

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    if(file.type !== 'application/pdf'){
      showToast('Please choose a PDF file.');
      fileInput.value = '';
      return;
    }
    pendingFile = file;
    uploadBox.classList.add('has-file');
    uploadHint.textContent = 'Selected:';
    uploadFilename.textContent = file.name + ' (' + fmtSize(file.size) + ')';
  });

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const bw = Number(document.getElementById('bw').value) || 0;
    const color = Number(document.getElementById('color').value) || 0;
    const method = (document.querySelector('input[name="method"]:checked') || {}).value || 'XEROX';
    if(!name) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading...';

    try{
      const fd = new FormData();
      fd.append('name', name);
      fd.append('bw', bw);
      fd.append('color', color);
      fd.append('method', method);
      if(pendingFile) fd.append('file', pendingFile);

      const res = await fetch(API_BASE + '/jobs', { method: 'POST', body: fd });
      if(!res.ok) throw new Error('upload failed');

      e.target.reset();
      document.getElementById('bw').value = 0;
      document.getElementById('color').value = 0;
      pendingFile = null;
      uploadBox.classList.remove('has-file');
      uploadHint.textContent = 'Tap to choose a PDF from this device';
      uploadFilename.textContent = '';

      await loadJobs();
      notifyOtherTabs();
      showToast('Added to queue and synced.');
    }catch(err){
      showToast('Could not add job. Check your connection and try again.');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add to queue';
    }
  });

  document.getElementById('searchBox').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    render();
  });

  window.copyTicket = function(id, ticket){
    try{
      navigator.clipboard.writeText(ticket);
      showToast('Copied ' + ticket + ' to clipboard.');
    }catch(e){
      showToast(ticket);
    }
  };

  window.duplicateJob = async function(id){
    const job = jobs.find(j => j.id === id);
    if(!job) return;
    try{
      const fd = new FormData();
      fd.append('name', job.name + ' (copy)');
      fd.append('bw', job.bw || 0);
      fd.append('color', job.color || 0);
      fd.append('method', job.method || 'XEROX');
      const res = await fetch(API_BASE + '/jobs', { method: 'POST', body: fd });
      if(!res.ok) throw new Error('duplicate failed');
      await loadJobs();
      notifyOtherTabs();
      showToast('Job duplicated (attach a PDF to the copy if needed).');
    }catch(err){
      showToast('Could not duplicate job.');
    }
  };

  window.markAllDone = async function(){
    const targets = getFilteredJobs().filter(j => !j.done);
    if(targets.length === 0){ showToast('Nothing to mark — all done already.'); return; }
    if(!confirm(`Mark ${targets.length} job(s) as done?`)) return;
    try{
      await Promise.all(targets.map(j => fetch(API_BASE + '/jobs/' + j.id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: true })
      })));
      await loadJobs();
      notifyOtherTabs();
      showToast('Marked as done.');
    }catch(err){
      showToast('Could not update all jobs.');
    }
  };

  window.clearCompleted = async function(){
    const targets = getFilteredJobs().filter(j => j.done);
    if(targets.length === 0){ showToast('No completed jobs to clear.'); return; }
    if(!confirm(`Remove ${targets.length} completed job(s)? This can't be undone.`)) return;
    try{
      await Promise.all(targets.map(j => fetch(API_BASE + '/jobs/' + j.id, { method: 'DELETE' })));
      await loadJobs();
      notifyOtherTabs();
      showToast('Completed jobs cleared.');
    }catch(err){
      showToast('Could not clear completed jobs.');
    }
  };

  window.startEdit = function(id){ editingId = id; render(); };
  window.cancelEdit = function(){ editingId = null; render(); };

  window.saveEdit = async function(id){
    const name = document.getElementById(`edit-name-${id}`).value.trim();
    const bw = Number(document.getElementById(`edit-bw-${id}`).value) || 0;
    const color = Number(document.getElementById(`edit-color-${id}`).value) || 0;
    const methodEl = document.querySelector(`input[name="edit-method-${id}"]:checked`);
    const method = methodEl ? methodEl.value : 'XEROX';
    try{
      const res = await fetch(API_BASE + '/jobs/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, bw, color, method })
      });
      if(!res.ok) throw new Error('update failed');
      editingId = null;
      await loadJobs();
      notifyOtherTabs();
    }catch(err){
      showToast('Could not save changes.');
    }
  };

  window.toggleDone = async function(id){
    const job = jobs.find(j => j.id === id);
    if(!job) return;
    const prevDone = !!job.done;
    const newDone = !prevDone;
    job.done = newDone; // optimistic
    pendingToggles.set(id, newDone);
    render();
    try{
      const res = await fetch(API_BASE + '/jobs/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: job.done })
      });
      if(!res.ok) throw new Error('update failed');
      // Give the backend a brief moment to become read-consistent before trusting
      // a fresh GET again; meanwhile pendingToggles protects our optimistic value
      // from being overwritten by any poll that lands in between.
      setTimeout(() => pendingToggles.delete(id), 2500);
      await loadJobs(true);
      notifyOtherTabs();
    }catch(err){
      pendingToggles.delete(id);
      job.done = prevDone; // revert
      render();
      showToast('Could not update status.');
    }
  };

  window.removeJob = async function(id){
    try{
      const res = await fetch(API_BASE + '/jobs/' + id, { method: 'DELETE' });
      if(!res.ok) throw new Error('delete failed');
      await loadJobs();
      notifyOtherTabs();
    }catch(err){
      showToast('Could not remove job.');
    }
  };

  loadJobs();
  // Fast polling so tick marks / status changes show up on every device almost immediately.
  setInterval(() => { if(editingId === null) loadJobs(true); }, 2000);

  // Instant refresh the moment this tab/device regains focus or comes back online.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && editingId === null) loadJobs(true);
  });
  window.addEventListener('focus', () => { if(editingId === null) loadJobs(true); });
  window.addEventListener('online', () => loadJobs(true));

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('print-queue-sw.js').catch(() => {});
  }
</script>
</body>
</html>
