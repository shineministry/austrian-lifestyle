<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K.M. Document Authenticator — Verify</title>
<style>
  :root{
    --bg-1:#0a0f0d;
    --bg-2:#0f1712;
    --forest:#1b3a2b;
    --forest-2:#274d38;
    --gold:#c9a227;
    --gold-2:#e6c65c;
    --burgundy:#5c1a2b;
    --text:#eae7dc;
    --muted:#9fae9f;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(201,162,39,0.25);
    --ok:#4caf6d;
    --bad:#c85a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Georgia','Times New Roman',serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(39,77,56,0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(92,26,43,0.28), transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%;max-width:620px;}
  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .card-header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--glass-border);
    text-align:center;
    background:linear-gradient(180deg, rgba(201,162,39,0.06), transparent);
  }
  .crest{
    width:52px;height:52px;margin:0 auto 12px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--gold-2);
    letter-spacing:1px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-2);
    font-weight:600;
  }
  .sub{
    color:var(--muted);
    font-size:12.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .body-pad{padding:28px 32px 32px;}
  label{
    display:block;
    font-size:11.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }
  .input-row{display:flex; gap:10px;}
  input{
    flex:1;
    padding:13px 14px;
    background:rgba(0,0,0,0.28);
    border:1px solid rgba(201,162,39,0.22);
    border-radius:8px;
    color:var(--text);
    font-family:'Courier New',monospace;
    font-size:16px;
    letter-spacing:3px;
    text-transform:uppercase;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.12);
  }
  button{
    padding:13px 20px;
    border:none;
    border-radius:9px;
    background:linear-gradient(135deg, var(--gold), #a9821f);
    color:#111;
    font-weight:700;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
    font-family:'Helvetica Neue',Arial,sans-serif;
    white-space:nowrap;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(201,162,39,0.3);}
  button:active{transform:translateY(0);}

  .result{
    margin-top:26px;
    display:none;
  }
  .result.show{display:block;}

  .status-banner{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13.5px;
    letter-spacing:.5px;
  }
  .status-banner.ok{
    background:rgba(76,175,109,0.12);
    border:1px solid rgba(76,175,109,0.45);
    color:#a9e6bb;
  }
  .status-banner.bad{
    background:rgba(200,90,90,0.12);
    border:1px solid rgba(200,90,90,0.45);
    color:#f0b3b3;
  }
  .status-banner .icon{
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    flex-shrink:0;
  }
  .status-banner.ok .icon{background:var(--ok); color:#062910;}
  .status-banner.bad .icon{background:var(--bad); color:#2b0808;}

  .cert{
    border:1px solid var(--gold);
    border-radius:14px;
    padding:26px;
    background:
      linear-gradient(160deg, rgba(39,77,56,0.35), rgba(92,26,43,0.18)),
      rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }
  .cert::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(201,162,39,0.35);
    border-radius:9px;
    pointer-events:none;
  }
  .cert-title{
    text-align:center;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold-2);
    margin-bottom:14px;
  }
  .doc-no{
    text-align:center;
    font-family:'Courier New',monospace;
    font-size:26px;
    letter-spacing:6px;
    font-weight:700;
    color:var(--gold-2);
    background:rgba(0,0,0,0.35);
    border-radius:10px;
    padding:14px 8px;
    margin:6px 0 18px;
    border:1px dashed rgba(201,162,39,0.4);
    word-break:break-all;
  }
  .field{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:13.5px;
  }
  .field:last-child{border-bottom:none;}
  .field .k{color:var(--muted); letter-spacing:.5px;}
  .field .v{color:var(--text); text-align:right; font-weight:600;}
  .seal{
    margin-top:18px;
    text-align:center;
    font-size:11.5px;
    color:var(--gold-2);
    letter-spacing:1.5px;
    font-style:italic;
  }
  .note{
    margin-top:16px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.5;
  }
  .placeholder-fields .v{color:var(--muted); font-weight:400; font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-header">
      <div class="crest">SKM</div>
      <h1>Document Verifier</h1>
      <div class="sub">Verify a 12‑Character Document No.</div>
    </div>
    <div class="body-pad">
      <label for="code">Enter Document Number</label>
      <div class="input-row">
        <input id="code" type="text" maxlength="12" placeholder="XX0000000000" />
        <button id="verifyBtn">Verify</button>
      </div>

      <div class="result" id="result">
        <div class="status-banner" id="banner">
          <div class="icon" id="bannerIcon">✓</div>
          <div id="bannerText">Valid document number.</div>
        </div>

        <div class="cert">
          <div class="cert-title">Document Details</div>
          <div class="doc-no" id="docNoDisplay">—</div>
          <div id="fields">
            <div class="field"><span class="k">Name</span><span class="v" id="outName">—</span></div>
            <div class="field"><span class="k">Capacity</span><span class="v" id="outCapacity">—</span></div>
            <div class="field"><span class="k">The</span><span class="v" id="outDate">—</span></div>
            <div class="field"><span class="k">Document Type</span><span class="v" id="outType">—</span></div>
            <div class="field"><span class="k">Purpose</span><span class="v" id="outPurpose">—</span></div>
            <div class="field"><span class="k">Issued</span><span class="v" id="outIssued">—</span></div>
          </div>
          <div class="seal">This document is authentic and is verified by <span id="outVerifier">S.K.M.</span></div>
        </div>
        <div class="note" id="noteText"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function charValue(c){
  return ALPHABET.indexOf(c);
}

function computeChecksum(chars10){
  let sum = 0;
  for(let i = 0; i < chars10.length; i++){
    sum += charValue(chars10[i]) * (i + 3);
  }
  sum = sum % 1296;
  const c1 = ALPHABET[Math.floor(sum / 36)];
  const c2 = ALPHABET[sum % 36];
  return c1 + c2;
}

function validateFormat(code){
  if(!code || code.length !== 12) return { valid:false, reason:"Document number must be exactly 12 characters." };
  const upper = code.toUpperCase();
  for(const ch of upper){
    if(ALPHABET.indexOf(ch) === -1) return { valid:false, reason:"Document number contains invalid characters." };
  }
  const first10 = upper.slice(0, 10);
  const givenChecksum = upper.slice(10, 12);
  const expectedChecksum = computeChecksum(first10);
  if(givenChecksum !== expectedChecksum){
    return { valid:false, reason:"Checksum mismatch — this number was not issued by this system, or has been altered." };
  }
  return { valid:true };
}

function lookupRecord(code){
  try{
    const store = JSON.parse(localStorage.getItem("skm_doc_records") || "{}");
    return store[code.toUpperCase()] || null;
  }catch(e){
    return null;
  }
}

function showBanner(ok, text){
  const banner = document.getElementById("banner");
  const icon = document.getElementById("bannerIcon");
  const bannerText = document.getElementById("bannerText");
  banner.className = "status-banner " + (ok ? "ok" : "bad");
  icon.textContent = ok ? "✓" : "✕";
  bannerText.textContent = text;
}

document.getElementById("verifyBtn").addEventListener("click", runVerify);
document.getElementById("code").addEventListener("keydown", (e) => {
  if(e.key === "Enter") runVerify();
});

function runVerify(){
  const raw = document.getElementById("code").value.trim().toUpperCase();
  const result = document.getElementById("result");
  result.classList.add("show");
  document.getElementById("docNoDisplay").textContent = raw || "—";

  const fmt = validateFormat(raw);

  if(!fmt.valid){
    showBanner(false, fmt.reason);
    document.getElementById("outName").textContent = "—";
    document.getElementById("outCapacity").textContent = "—";
    document.getElementById("outDate").textContent = "—";
    document.getElementById("outType").textContent = "—";
    document.getElementById("outPurpose").textContent = "—";
    document.getElementById("outIssued").textContent = "—";
    document.getElementById("outVerifier").textContent = "S.K.M.";
    document.getElementById("noteText").textContent = "";
    return;
  }

  const record = lookupRecord(raw);

  if(record){
    showBanner(true, "Valid document. Format, checksum, and full record confirmed.");
    document.getElementById("outName").textContent = record.name || "—";
    document.getElementById("outCapacity").textContent = record.capacity || "—";
    document.getElementById("outDate").textContent = record.dateDisplay || record.date || "—";
    document.getElementById("outType").textContent = record.doctype || "—";
    document.getElementById("outPurpose").textContent = record.purpose || "—";
    document.getElementById("outIssued").textContent = record.issuedAt ? new Date(record.issuedAt).toLocaleString() : "—";
    document.getElementById("outVerifier").textContent = record.verifier || "S.K.M.";
    document.getElementById("noteText").textContent = "";
  }else{
    showBanner(true, "Valid format and checksum — this number matches a genuine S.K.M. document series.");
    document.getElementById("outName").textContent = "Not available on this device";
    document.getElementById("outCapacity").textContent = "—";
    document.getElementById("outDate").textContent = "—";
    document.getElementById("outType").textContent = "—";
    document.getElementById("outPurpose").textContent = "—";
    document.getElementById("outIssued").textContent = "—";
    document.getElementById("outVerifier").textContent = "S.K.M.";
    document.getElementById("noteText").textContent = "This document number is structurally authentic, but its full details were generated on a different device/browser and are not stored here. Verify on the same browser used to generate it for full details.";
  }
}
</script>
</body>
</html>
