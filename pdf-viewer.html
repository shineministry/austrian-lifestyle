<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#323639; font-family:system-ui,-apple-system,sans-serif; }

  /* ---- Top toolbar ---- */
  #toolbarContainer{
    position:fixed; top:0; left:0; right:0; height:40px; z-index:200;
    background:#323639; border-bottom:1px solid #1b1b1b;
    display:flex; align-items:center; padding:0 8px; gap:2px;
  }
  .toolbarBtn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:#d1d1d1; border-radius:4px;
    cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .toolbarBtn:hover{ background:rgba(255,255,255,0.1); }
  .toolbarBtn:disabled{ opacity:0.35; cursor:default; }
  .toolbarBtn:disabled:hover{ background:transparent; }
  .toolbarSeparator{ width:1px; height:20px; background:#555; margin:0 4px; flex-shrink:0; }

  #pageNumber{
    width:46px; height:24px; text-align:center; font-size:13px;
    background:#4a4d51; border:1px solid #666; color:#fff; border-radius:3px;
    flex-shrink:0;
  }
  #numPages{ color:#aaa; font-size:12px; margin-left:2px; flex-shrink:0; }

  #scaleSelect{
    height:24px; background:#4a4d51; border:1px solid #666; color:#fff;
    font-size:12px; border-radius:3px; padding:0 4px; flex-shrink:0;
  }
  #zoomOut, #zoomIn{ font-size:18px; font-weight:bold; }

  .toolbarSpacer{ flex:1; }

  /* ---- Sidebar ---- */
  #sidebar{
    position:fixed; top:40px; left:0; bottom:0; width:180px; z-index:150;
    background:#2a2d31; border-right:1px solid #1b1b1b; overflow-y:auto;
    display:none; padding:8px 0;
  }
  #sidebar.open{ display:block; }
  #sidebar .thumb{
    display:block; margin:4px auto; cursor:pointer; opacity:0.8;
    transition:opacity 0.15s;
  }
  #sidebar .thumb:hover, #sidebar .thumb.active{ opacity:1; }
  #sidebar .thumb.active{ outline:2px solid #4a90d9; outline-offset:2px; }
  #sidebar .thumb-label{
    text-align:center; font-size:11px; color:#999; margin-top:-4px; margin-bottom:6px;
  }

  /* ---- Viewer area ---- */
  #viewerContainer{
    position:fixed; top:40px; left:0; right:0; bottom:0;
    overflow-y:auto; overflow-x:auto; background:#525659;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 0;
    scroll-behavior:smooth;
  }
  #viewerContainer.sidebarOpen{ left:180px; }
  .page{
    background:#fff; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,0.35);
    flex-shrink:0;
  }
  .page:last-child{ margin-bottom:0; }

  .icon{ width:16px; height:16px; fill:currentColor; }

  /* ---- Print container (hidden on screen) ---- */
  #printContainer{ display:none; }

  /* ---- Loading overlay ---- */
  #printOverlay{
    display:none; position:fixed; inset:0; z-index:999;
    background:rgba(0,0,0,0.6); align-items:center; justify-content:center;
  }
  #printOverlay.active{ display:flex; }
  #printOverlay .msg{
    background:#323639; color:#fff; padding:20px 30px; border-radius:6px;
    font-size:14px; text-align:center;
  }

  /* ---- Print styles ---- */
  @media print{
    html, body{ height:auto !important; overflow:visible !important; background:#fff !important; }
    #toolbarContainer, #sidebar, #viewerContainer, #printOverlay{ display:none !important; }
    #printContainer{ display:block !important; }
    #printContainer .printPage{
      width:100%; margin:0; padding:0; page-break-after:always; page-break-inside:avoid;
      display:flex; align-items:flex-start; justify-content:center;
    }
    #printContainer .printPage:last-child{ page-break-after:auto; }
    #printContainer .printPage canvas{
      display:block; max-width:100%; height:auto;
    }
  }
</style>
</head>
<body>

<div id="toolbarContainer">
  <button class="toolbarBtn" id="sidebarToggle" title="Toggle Sidebar">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>
  <div class="toolbarSeparator"></div>
  <button class="toolbarBtn" id="prevBtn" title="Previous Page">
    <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>
  <input type="number" id="pageNumber" min="1" value="1">
  <span id="numPages">/ 1</span>
  <button class="toolbarBtn" id="nextBtn" title="Next Page">
    <svg class="icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </button>
  <div class="toolbarSeparator"></div>
  <button class="toolbarBtn" id="zoomOut" title="Zoom Out">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
  </button>
  <select id="scaleSelect">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5" selected>150%</option>
    <option value="2">200%</option>
    <option value="3">300%</option>
  </select>
  <button class="toolbarBtn" id="zoomIn" title="Zoom In">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
  <div class="toolbarSpacer"></div>
  <button class="toolbarBtn" id="fitWidth" title="Fit Width">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm4 2v2H5V7h2zm-2 6v-2h2v2H5zm0 2h2v2H5v-2zm14 4H5v-2h14v2zm0-4h-2v-2h2v2zm0-2h-2V9h2v2zm0-4h-2V7h2v2z"/></svg>
  </button>
  <button class="toolbarBtn" id="printBtn" title="Print">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
  </button>
  <div class="toolbarSeparator"></div>
  <button class="toolbarBtn" id="closeBtn" title="Close" style="color:#e55;">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
</div>

<div id="sidebar"></div>

<div id="viewerContainer">
  <div id="viewer"></div>
</div>

<div id="printContainer"></div>

<div id="printOverlay">
  <div class="msg">Preparing print&hellip;</div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pdfDoc = null, currentPage = 1, currentScale = 1.5;
  var sidebarOpen = false;
  var printScale = 150 / 72;

  var params = new URLSearchParams(window.location.search);
  var fileUrl = params.get('file');
  document.title = params.get('title') || 'PDF Viewer';

  if(fileUrl){
    pdfjsLib.getDocument(decodeURIComponent(fileUrl)).promise.then(function(pdf){
      pdfDoc = pdf;
      document.getElementById('numPages').textContent = '/ ' + pdf.numPages;
      document.getElementById('pageNumber').max = pdf.numPages;
      renderAll();
      buildSidebar();
    }).catch(function(err){
      document.getElementById('viewer').innerHTML =
        '<p style="color:#fff;text-align:center;padding:60px 20px;">Could not load PDF.</p>';
    });
  }

  function renderAll(){
    if(!pdfDoc) return;
    var container = document.getElementById('viewer');
    container.innerHTML = '';
    for(var i = 1; i <= pdfDoc.numPages; i++){
      (function(pageNum){
        pdfDoc.getPage(pageNum).then(function(page){
          var vp = page.getViewport({ scale: currentScale });
          var c = document.createElement('canvas');
          c.className = 'page';
          c.id = 'page' + pageNum;
          c.width = vp.width;
          c.height = vp.height;
          c.style.width = vp.width + 'px';
          c.style.height = vp.height + 'px';
          container.appendChild(c);
          page.render({ canvasContext: c.getContext('2d'), viewport: vp });
          updateThumbActive(pageNum);
        });
      })(i);
    }
  }

  function buildSidebar(){
    var sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    for(var i = 1; i <= pdfDoc.numPages; i++){
      (function(pageNum){
        pdfDoc.getPage(pageNum).then(function(page){
          var vp = page.getViewport({ scale: 0.2 });
          var c = document.createElement('canvas');
          c.className = 'thumb';
          c.width = vp.width;
          c.height = vp.height;
          c.style.width = vp.width + 'px';
          c.style.height = vp.height + 'px';
          c.onclick = function(){
            var el = document.getElementById('page' + pageNum);
            if(el) el.scrollIntoView({ behavior:'smooth' });
          };
          sidebar.appendChild(c);
          page.render({ canvasContext: c.getContext('2d'), viewport: vp });

          var label = document.createElement('div');
          label.className = 'thumb-label';
          label.textContent = pageNum;
          sidebar.appendChild(label);
        });
      })(i);
    }
  }

  function updateThumbActive(num){
    document.querySelectorAll('.thumb').forEach(function(t,i){
      t.classList.toggle('active', i === num - 1);
    });
  }

  function updatePageFromScroll(){
    if(!pdfDoc) return;
    var container = document.getElementById('viewerContainer');
    var pages = document.querySelectorAll('.page');
    var mid = container.scrollTop + container.clientHeight / 2;
    for(var i = 0; i < pages.length; i++){
      if(pages[i].offsetTop + pages[i].offsetHeight >= mid){
        currentPage = i + 1;
        break;
      }
    }
    document.getElementById('pageNumber').value = currentPage;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= pdfDoc.numPages;
    updateThumbActive(currentPage);
  }

  document.getElementById('viewerContainer').addEventListener('scroll', updatePageFromScroll);

  document.getElementById('prevBtn').addEventListener('click', function(){
    if(currentPage <= 1) return;
    var el = document.getElementById('page' + (currentPage - 1));
    if(el) el.scrollIntoView({ behavior:'smooth' });
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if(!pdfDoc || currentPage >= pdfDoc.numPages) return;
    var el = document.getElementById('page' + (currentPage + 1));
    if(el) el.scrollIntoView({ behavior:'smooth' });
  });

  document.getElementById('pageNumber').addEventListener('change', function(){
    var n = parseInt(this.value);
    if(!pdfDoc || n < 1 || n > pdfDoc.numPages) return;
    var el = document.getElementById('page' + n);
    if(el) el.scrollIntoView({ behavior:'smooth' });
  });

  function setScale(s){
    currentScale = Math.max(0.5, Math.min(4, s));
    document.getElementById('scaleSelect').value = currentScale;
    renderAll();
    buildSidebar();
  }
  document.getElementById('scaleSelect').addEventListener('change', function(){
    setScale(parseFloat(this.value));
  });
  document.getElementById('zoomIn').addEventListener('click', function(){ setScale(currentScale + 0.25); });
  document.getElementById('zoomOut').addEventListener('click', function(){ setScale(currentScale - 0.25); });

  document.getElementById('fitWidth').addEventListener('click', function(){
    if(!pdfDoc) return;
    pdfDoc.getPage(currentPage).then(function(page){
      var vp = page.getViewport({ scale: 1 });
      var containerWidth = document.getElementById('viewerContainer').clientWidth - 20;
      setScale(containerWidth / vp.width);
    });
  });

  document.getElementById('sidebarToggle').addEventListener('click', function(){
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
    document.getElementById('viewerContainer').classList.toggle('sidebarOpen', sidebarOpen);
  });

  /* ---- Proper pdf.js-style print ---- */
  document.getElementById('printBtn').addEventListener('click', doPrint);

  function doPrint(){
    if(!pdfDoc) return;
    var overlay = document.getElementById('printOverlay');
    var container = document.getElementById('printContainer');
    overlay.classList.add('active');
    container.innerHTML = '';

    var ops = [];
    for(var i = 1; i <= pdfDoc.numPages; i++){
      (function(pageNum){
        ops.push(pdfDoc.getPage(pageNum).then(function(page){
          var vp = page.getViewport({ scale: printScale });
          var c = document.createElement('canvas');
          c.width = vp.width;
          c.height = vp.height;
          var ctx = c.getContext('2d');
          return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){
            var div = document.createElement('div');
            div.className = 'printPage';
            div.appendChild(c);
            container.appendChild(div);
          });
        }));
      })(i);
    }

    Promise.all(ops).then(function(){
      overlay.classList.remove('active');
      setTimeout(function(){ window.print(); }, 200);
    }).catch(function(){
      overlay.classList.remove('active');
    });
  }

  document.getElementById('closeBtn').addEventListener('click', function(){
    if(window.parent && window.parent !== window) window.parent.closePdfModal();
  });

  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ document.getElementById('prevBtn').click(); e.preventDefault(); }
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ document.getElementById('nextBtn').click(); e.preventDefault(); }
    if(e.key === '+' || e.key === '=') setScale(currentScale + 0.25);
    if(e.key === '-') setScale(currentScale - 0.25);
  });
</script>
</body>
</html>
